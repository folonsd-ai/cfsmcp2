[project]
name = "cfsmcp2"
version = "0.2.33"
description = "MCP server and UI for 1C metadata and BSL search"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0",
    "zvec>=0.6.0",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
portable = [
    "pyinstaller>=6.0",
    "pystray>=0.19",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
cfsmcp2 = "app.main:run"
cfsmcp2-launcher = "app.portable.launcher:main"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
